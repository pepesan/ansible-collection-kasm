---
# Removes an existing Kasm install so the next pepesan.kasm.site_kasm run is a
# genuine fresh install, instead of fixing a half-broken server by hand.
#
# Usage:
#   ansible-playbook -i <inventory> pepesan.kasm.kasm_uninstall
#
# To also force a brand new Let's Encrypt certificate on the next install:
#   ansible-playbook -i <inventory> pepesan.kasm.kasm_uninstall \
#     -e kasm_uninstall_remove_letsencrypt_certs=true \
#     -e node_name=kasmdemo -e kasm_base_domain=example.com
- name: Uninstall Kasm
  hosts: ubuntu
  roles:
    - pepesan.kasm.kasm_uninstall
