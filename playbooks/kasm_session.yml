---
# Starts (or destroys) a Kasm session through the public API. Optional
# recovery can start the same registered workspace container after a reboot.
#
# Usage:
#   ansible-playbook -i <inventory> pepesan.kasm.kasm_session \
#     -e '{"kasm_session_workspace": "Python Docker (Ubuntu 26.04)"}'
#
# NOTE: a name with spaces must be passed as JSON (as above); with
# -e key="a b" the value is cut at the first space.
#
# Another user / workspace / action:
#   ansible-playbook -i <inventory> pepesan.kasm.kasm_session \
#     -e kasm_session_user=admin@kasm.local \
#     -e kasm_session_workspace=pepesan/mi-ubuntu-resolute-kasm-python-dind:1.3
#   ansible-playbook -i <inventory> pepesan.kasm.kasm_session \
#     -e '{"kasm_session_workspace": "Python Docker (Ubuntu 26.04)"}' \
#     -e kasm_session_state=absent
- name: Start or destroy a Kasm session
  hosts: kasm
  roles:
    - pepesan.kasm.kasm_session
  post_tasks:
    - name: Verify the nested Docker daemon for a DinD workspace
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - kasm
          - docker
          - exec
          - "{{ kasm_session_container_id }}"
          - docker
          - info
      register: kasm_session_dind_check
      retries: 12
      delay: 5
      until: kasm_session_dind_check.rc == 0
      changed_when: false
      no_log: true
      when:
        - kasm_session_state == 'present'
        - "'dind' in kasm_session_workspace | lower"
        - kasm_session_status == 'running'

    - name: Report nested Docker readiness
      ansible.builtin.debug:
        msg: "Nested Docker is ready in the {{ kasm_session_workspace }} session."
      when:
        - kasm_session_state == 'present'
        - "'dind' in kasm_session_workspace | lower"
        - kasm_session_status == 'running'
    - name: Report deferred nested Docker check for a paused session
      ansible.builtin.debug:
        msg: >-
          The DinD session is paused; nested Docker verification is deferred.
          Connect to this same session, then rerun the playbook to verify it.
      when:
        - kasm_session_state == 'present'
        - "'dind' in kasm_session_workspace | lower"
        - kasm_session_status == 'paused'
