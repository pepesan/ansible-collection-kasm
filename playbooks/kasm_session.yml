---
# Starts (or destroys) a Kasm session through the public API. Optional
# recovery can start the same registered workspace container after a reboot.
#
# Usage:
#   ansible-playbook -i <inventory> pepesan.kasm.kasm_session \
#     -e '{"kasm_session_workspace": "Python Docker (Ubuntu 26.04)"}'
#
# NOTE: a name with spaces must be passed as JSON (as above); with
# -e key="a b" the value is cut at the first space.
#
# Another user / workspace / action:
#   ansible-playbook -i <inventory> pepesan.kasm.kasm_session \
#     -e kasm_session_user=admin@kasm.local \
#     -e kasm_session_workspace=pepesan/mi-ubuntu-resolute-kasm-python-dind:1.3
#   ansible-playbook -i <inventory> pepesan.kasm.kasm_session \
#     -e '{"kasm_session_workspace": "Python Docker (Ubuntu 26.04)"}' \
#     -e kasm_session_state=absent
- name: Start or destroy a Kasm session
  hosts: kasm
  roles:
    - pepesan.kasm.kasm_session
