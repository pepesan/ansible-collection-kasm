---
name: Release

# Publishes the collection on Ansible Galaxy when a version tag is pushed
# (for example v0.0.1). It needs the GALAXY_API_KEY secret of the repository.
#
# It can also be started by hand ("Run workflow", or `gh workflow run release.yml`) as a DRY RUN: it
# builds and checks everything exactly as for a release but does not publish and does not create
# the GitHub release, because that only happens when the run was started by a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to create the GitHub release

jobs:
  publish:
    name: Validate, build, and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the CI tools
        run: >-
          pip install ansible-core==2.21.5 ansible-lint==26.10.1 yamllint==1.38.0
          molecule==26.10.0 'molecule-plugins[docker]' pyyaml

      - name: Install the collections and third-party roles
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy role install -r requirements.yml

      - name: Install this collection for lint and Molecule
        run: ansible-galaxy collection install . --force

      - name: ansible-lint
        run: ansible-lint

      - name: yamllint
        run: yamllint .

      - name: The tag must match the version in galaxy.yml
        if: github.ref_type == 'tag'
        run: |
          version="$(python3 -c "import yaml; print(yaml.safe_load(open('galaxy.yml'))['version'])")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match galaxy.yml version ${version}" >&2
            exit 1
          fi

      - name: Check the tarball (content, clean install, playbooks by name)
        run: scripts/check-build.sh
      - name: Every YAML play in the documentation
        run: scripts/check-examples.sh

      - name: Molecule — linux_user
        run: scripts/molecule.sh linux_user test

      - name: Molecule — student
        run: scripts/molecule.sh student test

      - name: Molecule — kasm_credentials
        run: scripts/molecule.sh kasm_credentials test

      - name: Build
        run: ansible-galaxy collection build --output-path dist

      - name: Publish on Ansible Galaxy
        if: github.ref_type == 'tag'
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          if [ -z "${GALAXY_API_KEY}" ]; then
            echo "The GALAXY_API_KEY secret is not set in the repository" >&2
            exit 1
          fi
          ansible-galaxy collection publish dist/*.tar.gz --token "${GALAXY_API_KEY}"

      - name: Dry run summary (nothing was published)
        if: github.ref_type != 'tag'
        run: |
          echo "Dry run on ${GITHUB_REF_NAME}: tarball built and checked, NOT published."
          ls -l dist/

      - name: GitHub release with the tarball
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz --title "${GITHUB_REF_NAME}" --generate-notes
