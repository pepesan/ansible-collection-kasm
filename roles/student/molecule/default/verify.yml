---
- name: Verify
  hosts: all
  tasks:
    - name: Gather the student user's facts
      ansible.builtin.getent:
        database: passwd
        key: student

    - name: Assert the student user exists with the right shell
      ansible.builtin.assert:
        that:
          - "'student' in getent_passwd"
          - getent_passwd.student[5] == "/bin/bash"

    - name: Assert student belongs to the docker and sudo groups
      ansible.builtin.command: id -nG student
      register: student_groups
      changed_when: false
      failed_when: >-
        'docker' not in student_groups.stdout
        or 'sudo' not in student_groups.stdout
