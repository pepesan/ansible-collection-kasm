---
- name: Initialize the failed-node summary
  ansible.builtin.set_fact:
    kasm_dns_preflight_failed_hosts: []
  changed_when: false

- name: Collect hosts that failed DNS validation
  ansible.builtin.set_fact:
    kasm_dns_preflight_failed_hosts: "{{ kasm_dns_preflight_failed_hosts + [item] }}"
  loop: "{{ groups.get('kasm', []) }}"
  when: hostvars[item].kasm_dns_preflight_failed | default(false) | bool
  changed_when: false

- name: Highlight DNS failures at the end of the deployment log
  ansible.builtin.debug:
    msg: |
      DNS PREFLIGHT FAILED ON {{ kasm_dns_preflight_failed_hosts | length }} HOST(S):
      {% for host in kasm_dns_preflight_failed_hosts %}
      - {{ host }} ({{ hostvars[host].kasm_dns_preflight_domain | default('unknown domain') }})
        {{ hostvars[host].kasm_dns_preflight_error | default('DNS check failed') }}
      {% endfor %}
  when: kasm_dns_preflight_failed_hosts | length > 0

- name: Fail the deployment after summarizing DNS failures
  ansible.builtin.fail:
    msg: >-
      DNS preflight failed on {{ kasm_dns_preflight_failed_hosts | length }}
      Kasm host(s); other hosts continued. See the DNS failure summary above.
  when: kasm_dns_preflight_failed_hosts | length > 0

- name: Report that no DNS preflight failures were recorded
  ansible.builtin.debug:
    msg: "No public DNS preflight failures were recorded for group kasm."
  when: kasm_dns_preflight_failed_hosts | length == 0
