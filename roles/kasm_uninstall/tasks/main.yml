---
- name: Check the uninstall layout
  ansible.builtin.assert:
    that:
      - kasm_uninstall_layout in ['allinone', 'manager', 'agent']
    fail_msg: "kasm_uninstall_layout must be allinone, manager or agent (got '{{ kasm_uninstall_layout }}')."
    quiet: true

- name: Find boot-time Kasm session recovery units
  ansible.builtin.find:
    paths: "{{ kasm_session_recover_unit_dir }}"
    patterns: "pepesan-kasm-session-*.service"
    file_type: file
  register: kasm_uninstall_session_recovery_units

- name: Disable boot-time Kasm session recovery units
  ansible.builtin.systemd_service:
    name: "{{ item.path | basename }}"
    state: stopped
    enabled: false
  loop: "{{ kasm_uninstall_session_recovery_units.files }}"

- name: Remove boot-time Kasm session recovery units
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ kasm_uninstall_session_recovery_units.files }}"

- name: Reload systemd after removing Kasm session recovery
  ansible.builtin.command:
    argv:
      - systemctl
      - daemon-reload
  changed_when: false
  when: kasm_uninstall_session_recovery_units.matched | int > 0

- name: Remove the Kasm session recovery helper
  ansible.builtin.file:
    path: "{{ kasm_session_recover_script }}"
    state: absent

- name: Uninstall the all-in-one layout
  ansible.builtin.include_tasks: allinone.yml
  when: kasm_uninstall_layout == "allinone"

- name: Uninstall the official manager/agent layout
  ansible.builtin.include_tasks: official.yml
  when: kasm_uninstall_layout in ["manager", "agent"]

# Never touched by the manager/agent layouts unless asked: the certificates
# of /etc/letsencrypt survive so a reinstall does not spend rate limit.
- name: Remove the host's Let's Encrypt certificate for this domain
  ansible.builtin.file:
    path: "/etc/letsencrypt/live/{{ kasm_domain }}"
    state: absent
  when: kasm_uninstall_remove_letsencrypt_certs | bool
