---
- name: Find boot-time Kasm session recovery units
  ansible.builtin.find:
    paths: "{{ kasm_session_recover_unit_dir }}"
    patterns: "pepesan-kasm-session-*.service"
    file_type: file
  register: kasm_uninstall_session_recovery_units

- name: Disable boot-time Kasm session recovery units
  ansible.builtin.systemd_service:
    name: "{{ item.path | basename }}"
    state: stopped
    enabled: false
  loop: "{{ kasm_uninstall_session_recovery_units.files }}"

- name: Remove boot-time Kasm session recovery units
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ kasm_uninstall_session_recovery_units.files }}"

- name: Reload systemd after removing Kasm session recovery
  ansible.builtin.command:
    argv:
      - systemctl
      - daemon-reload
  changed_when: false
  when: kasm_uninstall_session_recovery_units.matched | int > 0

- name: Remove the Kasm session recovery helper
  ansible.builtin.file:
    path: "{{ kasm_session_recover_script }}"
    state: absent

- name: Check whether the Kasm compose file still exists
  ansible.builtin.stat:
    path: "{{ kasm_dir }}/compose.yaml"
  register: kasm_uninstall_compose_file

- name: Stop and remove the Kasm container (and its DinD networks/volumes)
  community.docker.docker_compose_v2:
    project_src: "{{ kasm_dir }}"
    files:
      - compose.yaml
    state: absent
    remove_volumes: true
  when: kasm_uninstall_compose_file.stat.exists

- name: Remove the Kasm container image from the host
  community.docker.docker_image:
    name: "lscr.io/linuxserver/kasm:{{ kasm_image_tag }}"
    state: absent
  when: kasm_uninstall_remove_image | bool

- name: Remove the persisted Kasm data (database, certs, install marker, profiles)
  ansible.builtin.file:
    path: "{{ kasm_dir }}/data"
    state: absent
  when: kasm_uninstall_remove_data | bool

- name: Remove the rest of the Kasm directory (compose.yaml, init script)
  ansible.builtin.file:
    path: "{{ kasm_dir }}"
    state: absent
  when: kasm_uninstall_remove_all | bool

- name: Remove the host's Let's Encrypt certificate for this domain
  ansible.builtin.file:
    path: "/etc/letsencrypt/live/{{ kasm_domain }}"
    state: absent
  when: kasm_uninstall_remove_letsencrypt_certs | bool
