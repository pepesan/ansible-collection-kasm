---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: Launch a session (the first poll answers "starting", then "running")
      ansible.builtin.include_role:
        name: pepesan.kasm.kasm_session
      vars:
        kasm_session_workspace: "pepesan/core-ubuntu-resolute:1.20"
        kasm_session_poll_seconds: 1
        kasm_session_timeout_seconds: 30
