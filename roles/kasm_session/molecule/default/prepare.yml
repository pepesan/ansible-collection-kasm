---
- name: Prepare the fake Kasm API
  hosts: all
  gather_facts: false
  tasks:
    - name: Create the fake Kasm directory
      ansible.builtin.file:
        path: "{{ kasm_dir }}"
        state: directory
        mode: "0755"

    - name: Write the API key file the role reads
      ansible.builtin.copy:
        dest: "{{ kasm_dir }}/.kasm_api_key.json"
        content: '{"api_key": "molecule-key", "api_key_secret": "molecule-secret"}'
        mode: "0600"

    - name: Make sure the port is free
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ mock_port }}"
        state: stopped
        timeout: 3

    - name: Start the fake Kasm API in the background
      ansible.builtin.shell: |
        nohup python3 -I "{{ playbook_dir }}/mock_kasm_api.py" --port {{ mock_port }} \
          > "{{ mock_dir }}/mock.log" 2>&1 &
        echo $! > "{{ mock_dir }}/mock.pid"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Wait until it answers
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ mock_port }}"
        timeout: 15

    - name: Start from a clean state (a session takes 2 polls to reach running)
      ansible.builtin.uri:
        url: "{{ kasm_url }}/_reset"
        method: POST
        body_format: json
        body:
          starting_polls: 2
