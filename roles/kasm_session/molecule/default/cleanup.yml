---
- name: Stop the fake Kasm API
  hosts: all
  gather_facts: false
  tasks:
    - name: Read its pid
      ansible.builtin.slurp:
        src: "{{ mock_dir }}/mock.pid"
      register: mock_pid
      failed_when: false

    - name: Stop it
      ansible.builtin.command: "kill {{ mock_pid.content | b64decode | trim }}"
      when: mock_pid.content is defined
      changed_when: true
      failed_when: false
