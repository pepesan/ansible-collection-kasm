---
kasm_dir: /opt/kasm
kasm_url: "https://127.0.0.1:443"

# present: make sure the user has a session of the workspace
#          (launch it if missing, wait until "running" or Kasm-managed "paused").
# absent:  destroy that session if it exists.
kasm_session_state: present

# Kasm username that owns the session. It must already exist (see kasm_user).
kasm_session_user: "user@kasm.local"

# An ALREADY REGISTERED workspace, by its image "name" (the docker image,
# e.g. pepesan/mi-ubuntu-resolute-kasm-python-dind:1.3) or by its
# "friendly_name" (what the dashboard shows, e.g. "Python Docker (Ubuntu
# 26.04)"). Required; see kasm_workspace to register one.
kasm_session_workspace: ""

# How long to wait for the session to reach a usable status ("running" or
# Kasm-managed "paused"), polling every kasm_session_poll_seconds.
kasm_session_timeout_seconds: 600
kasm_session_poll_seconds: 5

# Kasm may refuse a session request for a moment (for example right after a
# workspace was registered). The request is retried this many times, with this
# many seconds between attempts, before the role fails.
kasm_session_launch_retries: 18
kasm_session_launch_delay: 10

# Re-start the existing workspace container if Kasm reports the session as
# stopped/paused but its container is created/exited (e.g. after host reboot).
# This targets the same container/kasm_id; it never creates a replacement.
# Requires Docker access to the Kasm DinD container.
kasm_session_recover_stopped: false
# Install a systemd one-shot that starts this same container after a host reboot.
# The unit waits for the host Docker daemon and Kasm's nested Docker daemon.
kasm_session_recover_on_boot: true

# Host paths owned by this role for boot-time session recovery.
kasm_session_recover_script: /usr/local/sbin/pepesan-kasm-session-recover
kasm_session_recover_unit_dir: /etc/systemd/system

# Reuses the persistent, ansible-managed API key bootstrapped by
# kasm_workspace on this host (same file kasm_user reads). It needs the
# request_kasm / get_kasm_status / get_kasms / destroy_kasm permissions,
# which that key already holds.
kasm_session_api_key_file: "{{ kasm_dir }}/.kasm_api_key.json"
