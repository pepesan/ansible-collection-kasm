---
kasm_dir: /opt/kasm
kasm_url: "https://127.0.0.1:443"

kasm_user_username: ""
# Password of the Kasm user being created. Random by default (20 characters),
# generated once and persisted per host and user so repeated runs reuse it;
# pass kasm_user_password to set a fixed one. It is a different variable from
# kasm_default_user_password (the built-in user@kasm.local, see kasm_credentials).
kasm_user_credentials_dir: "{{ lookup('ansible.builtin.env', 'PWD') | default(playbook_dir, true) }}/.credentials"
kasm_user_password: >-
  {{ lookup('password', kasm_user_credentials_dir ~ '/' ~ inventory_hostname ~ '-kasm-user-'
  ~ (kasm_user_username | regex_replace('[^A-Za-z0-9._-]+', '-'))
  ~ '.pass length=20 chars=ascii_letters,digits') }}
kasm_user_first_name: ""
kasm_user_last_name: ""
kasm_user_locked: false
kasm_user_disabled: false
kasm_user_organization: ""
kasm_user_phone: ""

# present: create the user if missing. absent: delete it if present.
kasm_user_state: present

# Reuses the persistent API key bootstrapped by kasm_workspace instead of
# minting a second one. It was verified for user listing/creation/deletion
# against Kasm 1.19.0; manually provided keys must have those permissions.
kasm_user_api_key_file: "{{ kasm_dir }}/.kasm_api_key.json"
