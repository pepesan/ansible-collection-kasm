---
# User CRUD uses Kasm's public API. Optional group membership uses the same
# Postgres relation as kasm_group, because create_user does not grant groups.

- name: Ensure kasm_user_username is set
  ansible.builtin.fail:
    msg: "kasm_user_username is required"
  when: kasm_user_username == ""

- name: Check whether the persistent API key exists on this host
  ansible.builtin.stat:
    path: "{{ kasm_user_api_key_file }}"
  register: kasm_user_api_key_stat

- name: Fail with guidance if no API key is available yet
  ansible.builtin.fail:
    msg: >-
      {{ kasm_user_api_key_file }} does not exist on this host. Run
      kasm_workspace at least once first to bootstrap the persistent API key,
      or create one manually with "Users Create", "Users Delete" and
      "Users View" permissions.
  when: not kasm_user_api_key_stat.stat.exists

- name: Read the persistent API key
  ansible.builtin.slurp:
    path: "{{ kasm_user_api_key_file }}"
  register: kasm_user_api_key_content

- name: Set API credential facts
  ansible.builtin.set_fact:
    kasm_user_api_key: "{{ (kasm_user_api_key_content.content | b64decode | from_json).api_key }}"
    kasm_user_api_key_secret: "{{ (kasm_user_api_key_content.content | b64decode | from_json).api_key_secret }}"
  no_log: true

- name: List existing Kasm users
  ansible.builtin.uri:
    url: "{{ kasm_url }}/api/public/get_users"
    method: POST
    body_format: json
    body:
      api_key: "{{ kasm_user_api_key }}"
      api_key_secret: "{{ kasm_user_api_key_secret }}"
    validate_certs: false
    status_code: 200
  register: kasm_user_list
  changed_when: false
  no_log: true

- name: Find this user in the list
  ansible.builtin.set_fact:
    kasm_user_existing: "{{ kasm_user_list.json.users | selectattr('username', 'equalto', kasm_user_username) | list | first | default(None) }}"

- name: Create the user
  ansible.builtin.uri:
    url: "{{ kasm_url }}/api/public/create_user"
    method: POST
    body_format: json
    body:
      api_key: "{{ kasm_user_api_key }}"
      api_key_secret: "{{ kasm_user_api_key_secret }}"
      target_user:
        username: "{{ kasm_user_username }}"
        password: "{{ kasm_user_password }}"
        first_name: "{{ kasm_user_first_name }}"
        last_name: "{{ kasm_user_last_name }}"
        locked: "{{ kasm_user_locked }}"
        disabled: "{{ kasm_user_disabled }}"
        organization: "{{ kasm_user_organization }}"
        phone: "{{ kasm_user_phone }}"
    validate_certs: false
    status_code: 200
  # Only runs when the user is missing, so reaching Kasm's API here is a real change.
  changed_when: true
  when:
    - kasm_user_state == "present"
    - kasm_user_existing is none
  no_log: true

- name: Delete the user
  ansible.builtin.uri:
    url: "{{ kasm_url }}/api/public/delete_user"
    method: POST
    body_format: json
    body:
      api_key: "{{ kasm_user_api_key }}"
      api_key_secret: "{{ kasm_user_api_key_secret }}"
      target_user:
        user_id: "{{ kasm_user_existing.user_id }}"
      force: true
    validate_certs: false
    status_code: 200
  # Only runs when the user exists, so reaching Kasm's API here is a real change.
  changed_when: true
  when:
    - kasm_user_state == "absent"
    - kasm_user_existing is not none
  no_log: true

- name: Resolve the user's requested group
  ansible.builtin.command: >
    {{ kasm_db_exec }} psql -U kasmapp -d kasm -t -c
    "SELECT group_id FROM groups WHERE name = convert_from(decode('{{ kasm_user_group_name | b64encode }}', 'base64'), 'UTF8');"
  register: kasm_user_group_id
  changed_when: false
  failed_when: kasm_user_group_id.rc != 0 or kasm_user_group_id.stdout | trim == ""
  when: kasm_user_state == "present" and kasm_user_group_name | length > 0

- name: Check existing user membership
  ansible.builtin.command: >
    {{ kasm_db_exec }} psql -U kasmapp -d kasm -t -c
    "SELECT count(*) FROM user_groups ug JOIN users u ON u.user_id = ug.user_id
    WHERE u.username = convert_from(decode('{{ kasm_user_username | b64encode }}', 'base64'), 'UTF8')
    AND ug.group_id = '{{ kasm_user_group_id.stdout | trim }}';"
  register: kasm_user_group_membership
  changed_when: false
  when: kasm_user_state == "present" and kasm_user_group_name | length > 0

- name: Add user to the requested group
  ansible.builtin.command: >
    {{ kasm_db_exec }} psql -U kasmapp -d kasm -c
    "INSERT INTO user_groups (user_id, group_id)
    SELECT u.user_id, '{{ kasm_user_group_id.stdout | trim }}'
    FROM users u WHERE u.username = convert_from(decode('{{ kasm_user_username | b64encode }}', 'base64'), 'UTF8');"
  changed_when: true
  when:
    - kasm_user_state == "present"
    - kasm_user_group_name | length > 0
    - kasm_user_group_membership.stdout | trim == "0"

- name: Verify requested user membership
  ansible.builtin.command: >
    {{ kasm_db_exec }} psql -U kasmapp -d kasm -t -c
    "SELECT count(*) FROM user_groups ug JOIN users u ON u.user_id = ug.user_id
    WHERE u.username = convert_from(decode('{{ kasm_user_username | b64encode }}', 'base64'), 'UTF8')
    AND ug.group_id = '{{ kasm_user_group_id.stdout | trim }}';"
  register: kasm_user_group_verify
  changed_when: false
  failed_when: kasm_user_group_verify.rc != 0 or kasm_user_group_verify.stdout | trim != "1"
  when: kasm_user_state == "present" and kasm_user_group_name | length > 0
