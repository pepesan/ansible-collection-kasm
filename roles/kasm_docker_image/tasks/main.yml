---
# Manages the Docker image itself, through kasm_docker_image_exec: by default
# Kasm's DinD (lscr.io/linuxserver/kasm runs its own nested Docker daemon,
# reached via "docker exec kasm docker ..."); on official agent hosts plain
# "docker". Independent of whether that image is registered as a Kasm
# workspace (see kasm_workspace). Idempotent: checks whether the image is
# already present before pulling/removing it.

- name: Ensure kasm_docker_image_name is set
  ansible.builtin.fail:
    msg: "kasm_docker_image_name is required (e.g. -e kasm_docker_image_name=user/image:tag)"
  when: kasm_docker_image_name == ""

- name: Check whether the image already exists
  ansible.builtin.command: "{{ kasm_docker_image_exec }} image inspect {{ kasm_docker_image_name }}"
  register: kasm_docker_image_inspect
  changed_when: false
  failed_when: false

- name: Pull the image
  ansible.builtin.command: "{{ kasm_docker_image_exec }} pull {{ kasm_docker_image_name }}"
  async: 1800
  poll: 30
  when:
    - kasm_docker_image_state == "present"
    - kasm_docker_image_inspect.rc != 0
  changed_when: true

- name: Remove the image
  ansible.builtin.command: "{{ kasm_docker_image_exec }} rmi {{ kasm_docker_image_name }}"
  register: kasm_docker_image_remove
  when:
    - kasm_docker_image_state == "absent"
    - kasm_docker_image_inspect.rc == 0
  changed_when: true

- name: Prune dangling layers/images left behind
  ansible.builtin.command: "{{ kasm_docker_image_exec }} image prune -f"
  register: kasm_docker_image_prune
  changed_when: "'Total reclaimed space: 0B' not in kasm_docker_image_prune.stdout"
  when:
    - kasm_docker_image_state == "absent"
    - kasm_docker_image_prune_after_remove
