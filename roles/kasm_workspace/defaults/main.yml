---
# Command prefix that reaches the Kasm PostgreSQL container. The default is
# the all-in-one install (Kasm inside the "kasm" DinD container). For the
# official host install (manager) use: "docker exec kasm_db".
kasm_db_exec: "docker exec kasm docker exec kasm_db"

# Control-node directory that receives the local copy of Kasm's API key
# (kasm-api-key-<inventory_hostname>.json). Defaults to kasm_credentials_dir
# when defined, otherwise to the directory Ansible runs from (the path used
# before this variable existed).
kasm_workspace_api_key_local_dir: >-
  {{ kasm_credentials_dir | default(lookup('ansible.builtin.env', 'PWD') | default(playbook_dir, true), true) }}

# Deleting a workspace also closes its sessions, removes users' profile
# directories and the Docker image in the DinD of THIS node. True for the
# all-in-one install. Set false on an official manager: those live on the
# agents (use kasm_docker_image there) and only the catalog entry is removed.
kasm_workspace_dind_cleanup: true
kasm_dir: /opt/kasm

# present: create/reuse the workspace. absent: delete it (or all of them).
kasm_workspace_state: present

# Default image when creating a workspace: the Kasm core desktop image built
# from https://github.com/pepesan/workspaces-core-images (Ubuntu 26.04, XFCE).
# It is only used for state "present": deleting never falls back to a default,
# so a delete always has to name its target (or use kasm_workspace_clean_all).
kasm_workspace_default_image: pepesan/core-ubuntu-resolute:1.20
kasm_workspace_image: "{{ kasm_workspace_default_image if kasm_workspace_state == 'present' else '' }}"
# Default name only while the default image is used; a custom image needs its
# own name.
kasm_workspace_name: "{{ 'Core Ubuntu Resolute' if kasm_workspace_image == kasm_workspace_default_image else '' }}"
kasm_workspace_desc: "{{ kasm_workspace_name }}"
kasm_workspace_cores: 4
kasm_workspace_memory_gb: 8
kasm_workspace_privileged: false
kasm_workspace_gpu_count: 0
kasm_workspace_session_time_limit: ""
kasm_workspace_category: ""
kasm_workspace_enabled: true

# "profile" family: persistent home directory settings for this workspace.
# Path on the HOST (inside Kasm's DinD) mounted as the user's home across
# sessions. Must contain {username} or {user_id}. Empty = no persistence.
kasm_workspace_profile_path: ""

# "group" family: zone/group-level settings this workspace participates in.
# Session Staging pre-warms containers ahead of time; it is configured at
# the zone level, not per workspace alone, and requires the zone to have a
# fixed proxy_hostname (see role README).
kasm_workspace_group_staging_enabled: false
kasm_workspace_group_staging_num_sessions: 1
kasm_workspace_group_staging_expiration_hours: 24
kasm_workspace_group_staging_zone_name: "default"

# "autostart" family: launches one session of this workspace for a given Kasm
# user right after the workspace is created/reused, so the first login finds
# a session already running instead of a cold start. Off by default: one
# running session permanently reserves cores_/memory_gb of the host. To keep
# it alive while nobody is connected, raise kasm_group_keepalive_seconds in
# the kasm_group role (3600 + action "pause" pauses it after an hour).
kasm_workspace_autostart_enabled: false
kasm_workspace_autostart_user: "user@kasm.local"
# Seconds to wait for the session to reach "running" (cold start of a large
# image can take minutes).
kasm_workspace_autostart_timeout_seconds: 600

# absent-only settings.
kasm_workspace_clean_all: false
kasm_workspace_delete_persistent_data: true
