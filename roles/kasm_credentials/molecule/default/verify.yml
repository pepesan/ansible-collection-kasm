---
# kasm_credentials writes the CSV via delegate_to: localhost (the control
# node), not the managed host — so this scenario actually writes to
# /tmp/molecule-kasm-credentials on whichever machine runs `molecule test`,
# not inside the test container. Verification must delegate the same way.
- name: Verify
  hosts: all
  tasks:
    - name: Find the generated access CSV
      ansible.builtin.find:
        paths: /tmp/molecule-kasm-credentials
        patterns: "access-data-*.csv"
      delegate_to: localhost
      become: false
      register: kasm_credentials_verify_csv

    - name: Assert the CSV was created
      ansible.builtin.assert:
        that: kasm_credentials_verify_csv.files | length > 0

    - name: Read the CSV content
      ansible.builtin.slurp:
        path: "{{ kasm_credentials_verify_csv.files[0].path }}"
      delegate_to: localhost
      become: false
      register: kasm_credentials_verify_csv_content

    - name: Split the CSV into header and row
      ansible.builtin.set_fact:
        kasm_credentials_verify_csv_lines: '{{ (kasm_credentials_verify_csv_content.content | b64decode | trim).splitlines() }}'

    - name: Assert the current schema, sorted URL first and a single named row
      ansible.builtin.assert:
        that:
          - kasm_credentials_verify_csv_lines | length == 2
          - >-
            kasm_credentials_verify_csv_lines[0] ==
            "kasm_url,ip,nombre,student_user,student_password,kasm_admin_user,kasm_admin_password,kasm_normal_user,kasm_normal_user_password"
          - (kasm_credentials_verify_csv_lines[1] | split(','))[0] == "https://molecule.example.com"
          - >-
            (kasm_credentials_verify_csv_lines[1] | split(','))[1] ==
            (hostvars[inventory_hostname].ansible_host | default(inventory_hostname))
          - (kasm_credentials_verify_csv_lines[1] | split(','))[2] == inventory_hostname
          - (kasm_credentials_verify_csv_lines[1] | split(','))[3] == "student"
    - name: Clean up the temp directory on the control node
      ansible.builtin.file:
        path: /tmp/molecule-kasm-credentials
        state: absent
      delegate_to: localhost
      become: false
