---
- name: Ensure the CSV directory exists on the control node
  ansible.builtin.file:
    path: "{{ kasm_credentials_csv_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

- name: Record this node's credentials in the access CSV (access-data-<inventory>.csv)
  ansible.builtin.command: >
    python3 {{ (role_path ~ '/files/update_credentials_csv.py') | quote }}
    --csv-dir {{ kasm_credentials_csv_dir | quote }}
    --ip {{ (ansible_host | default(inventory_hostname)) | quote }}
    --name {{ inventory_hostname | quote }}
    --student-user {{ kasm_credentials_student_name | quote }}
    --kasm-url {{ ('https://' ~ kasm_domain) | quote }}
    --kasm-admin-user {{ kasm_credentials_admin_user | quote }}
    --kasm-normal-user {{ kasm_credentials_user_user | quote }}
    --training-project "{{ kasm_training_project }}"
    --csv-prefix {{ kasm_credentials_csv_prefix | quote }}
    {{ ('--csv-name ' ~ (kasm_credentials_csv_name | quote)) if kasm_credentials_csv_name else '' }}
  delegate_to: localhost
  become: false
  environment:
    STUDENT_PASSWORD: "{{ kasm_credentials_student_password }}"
    KASM_ADMIN_PASSWORD: "{{ kasm_admin_password }}"
    KASM_USER_PASSWORD: "{{ kasm_default_user_password }}"
  register: kasm_credentials_csv_update
  changed_when: "'CHANGED' in kasm_credentials_csv_update.stdout"
  no_log: true

- name: Locate the updated credentials CSV
  ansible.builtin.find:
    paths: "{{ kasm_credentials_csv_dir }}"
    patterns: >-
      {{ kasm_credentials_csv_name
         if kasm_credentials_csv_name
         else kasm_credentials_csv_prefix ~ '-' ~ ((kasm_training_project | lower ~ '-') if kasm_training_project else '') ~ now(fmt='%Y-%m-%d') ~ '.csv' }}
  delegate_to: localhost
  become: false
  register: kasm_credentials_csv_found

- name: Report where the credentials were saved
  ansible.builtin.debug:
    msg: >-
      Access credentials saved to {{ kasm_credentials_csv_found.files[0].path }}
      (node {{ inventory_hostname }}, IP {{ ansible_host | default(inventory_hostname) }})
  when: kasm_credentials_csv_found.files | length > 0
