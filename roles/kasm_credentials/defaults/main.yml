---
# Where passwords and the CSV are written: the directory ansible-playbook is run from (PWD), NOT
# playbook_dir. A playbook run by name from the installed collection has its playbook_dir inside the
# collection, and credentials stored there would be lost (and regenerated, differently) on an upgrade.
# Directory (control node) where generated passwords are persisted. Must
# match student_credentials_dir if you want this role to pick up the
# same "student" password already generated by that role.
kasm_credentials_dir: "{{ lookup('ansible.builtin.env', 'PWD') | default(playbook_dir, true) }}/.credentials"
kasm_credentials_pass_prefix: "{{ kasm_credentials_dir }}/{{ inventory_hostname }}"

# Random per-host passwords, generated once and re-read on later runs.
# Override with -e kasm_admin_password=... / -e kasm_default_user_password=...
kasm_admin_password: "{{ lookup('password', kasm_credentials_pass_prefix + '-kasm-admin.pass length=20 chars=ascii_letters,digits') }}"
kasm_default_user_password: "{{ lookup('password', kasm_credentials_pass_prefix + '-kasm-user.pass length=20 chars=ascii_letters,digits') }}"

# The student password to dump into the access CSV alongside the Kasm
# credentials: the value the student role actually uses when it is in the play
# (so a fixed -e student_password_plain=... is what ends up in the CSV), or the
# password file that role generates otherwise.
kasm_credentials_student_name: "{{ student_name | default('student') }}"
kasm_credentials_student_password: >-
  {{ student_password_plain
     | default(lookup('password', kasm_credentials_pass_prefix ~ '-' ~ kasm_credentials_student_name
     ~ '.pass length=20 chars=ascii_letters,digits'), true) }}

kasm_credentials_admin_user: "admin@kasm.local"
kasm_credentials_user_user: "user@kasm.local"

# Course/cohort prefix so parallel deployments for different courses don't
# mix rows in the same CSV. Empty keeps the classic access-data-<date>.csv
# filename.
kasm_training_project: ""

# Exact name of the access CSV, derived from the inventory file used for the
# run: `-i inventory-my-course` -> access-data-inventory-my-course.csv. No date,
# so every deployment from the same inventory lands in the same file and the
# name says which hosts are in it. Set it to "" to fall back to
# access-data[-<proyecto>]-<date of the run>.csv (a new file each day).
# Prefix of the CSV file name. Keep the default (or add your own pattern to
# .gitignore): the repository ignores access-data-*.csv so credentials are not
# committed by mistake.
kasm_credentials_csv_prefix: access-data
# Characters other than letters, digits, '.', '_' and '-' are replaced, so an
# inline inventory ("-i 10.0.0.1,") or an unusual file name still gives a valid
# CSV name instead of making the role fail.
kasm_credentials_csv_name: >-
  {{ kasm_credentials_csv_prefix }}-{{ inventory_file | default('inventory') | basename
  | regex_replace('[^A-Za-z0-9._-]+', '-') | regex_replace('^-+|-+$', '') | default('inventory', true) }}.csv

kasm_credentials_csv_dir: "{{ lookup('ansible.builtin.env', 'PWD') | default(playbook_dir, true) }}"
